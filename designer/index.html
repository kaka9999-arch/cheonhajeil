<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1c1438">
<title>탑 설계자</title>
<meta name="description" content="백층탑 보스를 도트로 그리고 규칙 조각으로 조립한다. AI 도전자 여덟 명이 수백 판 덤벼 난이도 성적표를 내고, 공유 코드로 친구에게 도전장을 보낸다.">
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum&display=swap">
<link rel="stylesheet" href="style.91ef1c36.css">
</head>
<body>
<div id="app">
  <header class="top win">
    <a class="back" href="../">◀ 게임 상자</a>
    <div class="ttl">탑 <em>설계자</em> <small id="bossNameTop">이름 없는 문지기</small></div>
    <div class="actions">
      <button class="btn" type="button" id="btnNew">새로 만들기</button>
      <button class="btn primary" type="button" id="btnSave">보관함에 저장</button>
      <button class="btn" type="button" id="btnShare">공유</button>
    </div>
  </header>

    <section class="preview">
    <div class="win stagewrap">
      <canvas id="stage" aria-label="전투 무대 미리보기"></canvas>
      <div class="stagebtns">
        <select id="heroSel" aria-label="미리보기 영웅"></select>
        <button type="button" id="btnHit">피격</button>
        <button type="button" id="btnDie">쓰러짐</button>
      </div>
    </div>
    <div class="win plate" id="plate"></div>
    <div class="win quick" id="quick"></div>
  </section>

    <main class="win panel">
    <nav class="tabs" role="tablist">
      <button type="button" role="tab" data-tab="look" class="on">외형</button>
      <button type="button" role="tab" data-tab="stat">능력</button>
      <button type="button" role="tab" data-tab="talk">성격</button>
      <button type="button" role="tab" data-tab="test">시험</button>
      <button type="button" role="tab" data-tab="quest">과제</button>
      <button type="button" role="tab" data-tab="vault">보관함</button>
    </nav>
    <section class="tab" id="tab-look"></section>
    <section class="tab hidden" id="tab-stat"></section>
    <section class="tab hidden" id="tab-talk"></section>
    <section class="tab hidden" id="tab-test"></section>
    <section class="tab hidden" id="tab-quest"></section>
    <section class="tab hidden" id="tab-vault"></section>
  </main>
</div>
<div id="toast" class="toast" role="status" aria-live="polite"></div>
<div id="modal" class="modal hidden"><div class="win sheet" id="sheet"></div></div>

<script src="app.cfe62bc9.js"></script>
</body>
</html>
