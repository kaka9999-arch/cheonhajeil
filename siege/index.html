<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#1b2a3a">
<link rel="icon" href="data:,">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>공성 투석대</title>
<meta name="description" content="Phaser 3 의 Matter 물리로 만든 파괴 퍼즐. 돌을 당겨 쏘아 나무·돌·얼음·쇠로 쌓은 성채를 무너뜨리고 고블린을 전부 떨어뜨린다. 판 12개, 돌을 적게 쓸수록 별이 많다.">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+KR:wght@400;500;700&display=swap">
<link rel="stylesheet" href="style.777b6efa.css">
</head>
<body>
<div id="app">
  <section id="title" class="screen">
    <div class="hero">
      <div class="sub">- SIEGE -</div>
      <h1>공성 <em>투석대</em></h1>
      <div class="tag">당겨서 쏘고, <b>무너뜨린다</b></div>
      <div><a class="back" href="../">◀ 게임 상자</a></div>
    </div>
    <div class="panel">
      <div class="who">투석장 <b id="titleName">무명</b> <button id="btnName" class="btn sm" type="button">이름</button></div>
      <div id="titleInfo" class="mute"></div>
      <div class="row"><button id="btnPlay" class="btn primary" type="button">판 고르기</button></div>
    </div>
    <div class="howto">
      <div><b>당겨서 쏜다</b><span>투석대를 <em>끌었다 놓으면</em> 돌이 날아간다. 멀리 당길수록 세게.</span></div>
      <div><b>받치는 것을 노려라</b><span>얼음은 잘 깨지고 쇠는 거의 안 부서진다. 기둥을 치면 위가 통째로 무너진다.</span></div>
      <div><b>돌을 아껴라</b><span>고블린을 전부 떨어뜨리면 통과. 남은 돌이 많을수록 <em>별</em>이 많다.</span></div>
    </div>
    <div class="meta" id="metaGrid"></div>
    <div class="row" style="display:flex;gap:8px"><button id="btnRank" class="btn wide" type="button">투석 순위표</button><button id="btnSound" class="btn" type="button">소리 켬</button></div>
    <div id="rankPane" class="hidden"><button id="btnSubmit" class="btn wide" type="button" style="margin-top:8px">내 점수 올리기</button><div id="rankList"></div></div>
  <div class="credit" id="credit"></div>
  </section>

  <section id="pick" class="screen hidden">
    <div class="pickhead"><button class="btn sm" id="pickBack" type="button">◀ 타이틀</button><b>판 고르기</b><span class="mute" id="pickStars"></span></div>
    <div class="levels" id="levelList"></div>
  </section>

  <section id="play" class="screen hidden">
    <div class="phud">
      <button class="btn sm" id="btnQuit" type="button">◀</button>
      <b id="lvName">판</b>
      <span class="stones" id="stoneRow"></span>
      <span class="mute" id="foeLeft"></span>
      <button class="btn sm" id="btnRetry" type="button">다시</button>
    </div>
    <div id="game"></div>
    <div class="ptip" id="ptip">투석대를 끌었다 놓으면 돌이 날아간다</div>
  </section>
</div>
<div id="sheet" class="sheet hidden" role="dialog" aria-modal="true"><div class="box" id="sheetBox"></div></div>
<div id="pop" class="pop hidden"><div class="box" id="popBox"></div></div>
<div id="toast" role="status" aria-live="polite"></div>

<script src="https://cdn.jsdelivr.net/npm/zzfx@1.3.2/ZzFXMicro.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/phaser/3.80.1/phaser.min.js"></script>
<script src="app.c7811b92.js"></script>
</body>
</html>
