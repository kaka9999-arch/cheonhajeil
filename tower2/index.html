<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#06061a">
<link rel="icon" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>백층탑 2 · 역탑</title>
<meta name="description" content="백층탑 속편. 매치3 대결로 뒤집힌 탑 지하 100층을 내려간다. 갈림길 지도·특수 보석·장비·직업 각성·영혼 제단.">
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="stylesheet" href="style.43627b26.css">
</head>
<body>
<div id="app">
  <canvas id="scene"></canvas>

    <section id="title" class="screen">
    <div class="hero">
      <div class="sub">- MATCH 3 ROGUELITE II -</div>
      <h1>백층탑 <em>2</em></h1>
      <div class="eyebrow">뒤집힌 탑, 지하 백 층을 내려간다 · 영혼 조각은 남는다</div>
      <div class="eyebrow" style="margin-top:4px"><a href="../" style="color:var(--ylw)">◀ 게임 상자</a> · <a href="../tower/" style="color:var(--tx2)">전작 백층탑</a></div>
    </div>
    <div class="parch">
      <div class="eyebrow">직업 선택</div>
      <div id="classes" class="classes"></div>
      <div id="startRelic"></div>
      <div id="ascBox"></div>
      <div class="row" style="margin-top:8px">
        <button id="btnContinue" class="btn hidden" type="button">이어서 내려가기</button>
        <button id="btnStart" class="btn primary" type="button">역탑에 내려가기</button>
      </div>
    </div>
    <div class="row" style="margin-top:8px"><button id="btnAltar" class="btn dark wide" type="button">영혼 제단 · 영구 강화</button></div>
    <div id="dailyBox"></div>
    <div id="giftBox"></div>
    <div id="rivalBox"></div>
    <div class="meta-grid" id="metaGrid"></div>
    <div class="row">
      <button id="btnRank" class="btn dark" type="button">명예의 비석</button>
      <button id="btnAch" class="btn dark" type="button">업적·칭호</button>
      <button id="btnStats" class="btn dark" type="button">기록</button>
    </div>
    <div class="row" style="margin-top:8px">
      <button id="btnHelp" class="btn dark" type="button">규칙</button>
      <button id="btnSettings" class="btn dark" type="button">설정</button>
    </div>
    <div id="rankPane" class="hidden" style="margin-top:12px"><div id="rankList"></div></div>
  </section>

    <section id="map" class="screen hidden">
    <div class="head">
      <div><div class="eyebrow" id="mapCls">전사</div><div class="fl"><span id="mapFloor">B1</span><small id="mapZone">이끼 동굴</small></div></div>
      <div class="stat-line" id="mapStats"></div>
    </div>
    <div class="bar"><i id="mapHp"></i><span id="mapHpTxt"></span></div>
    <div class="mana" id="mapMana" style="margin-top:4px"></div>
    <div class="eyebrow" id="mapHint" style="margin:6px 0 2px;color:var(--tx2)"></div>
    <canvas id="mapCanvas" class="map-canvas"></canvas>
    <button id="btnDescend" class="btn primary wide hidden" type="button" style="margin-bottom:8px">아래 구역으로 내려간다</button>
    <div id="mapRival"></div>
    <div class="inv" id="mapInv"></div>
    <div class="row"><button id="btnEquip" class="btn dark" type="button">장비 · 가방</button><button id="btnSpellsView" class="btn dark" type="button">주문 확인</button></div>
    <div class="row" style="margin-top:8px"><button id="btnQuit" class="btn dark" type="button">역탑 밖으로 (포기)</button></div>
  </section>

    <section id="battle" class="screen hidden">
    <div class="stage" id="stage">
      <canvas id="mon"></canvas>
      <div id="bubble"></div>
      <div id="replayTag" class="replaytag hidden">REPLAY</div>
    </div>
    <div class="unit enemy" id="enemyPanel"></div>
    <div class="boardwrap">
      <canvas id="board" width="640" height="640"></canvas>
      <div id="turnBanner" class="turnbanner"></div>
      <div id="floats"></div>
    </div>
    <div class="unit me" id="playerPanel"></div>
    <div class="spells" id="spellGrid"></div>
    <div class="battlebar" id="battleBar"></div>
  </section>

    <section id="reward" class="screen hidden">
    <div class="parch">
      <div class="eyebrow" id="rewardEyebrow">승리</div>
      <h2 id="rewardTitle">전리품</h2>
      <div class="reward-sum" id="rewardSum"></div>
      <div id="rewardLevel"></div>
      <h3 id="rewardCardsTitle">주문 카드 · 하나를 고른다</h3>
      <div class="cards" id="rewardCards"></div>
      <div class="row"><button id="btnRewardSkip" class="btn" type="button">건너뛰기</button></div>
    </div>
  </section>

    <section id="room" class="screen hidden">
    <div class="parch">
      <div class="eyebrow" id="roomEyebrow"></div>
      <h2 id="roomTitle"></h2>
      <p id="roomText"></p>
      <div id="roomBody"></div>
      <div class="row" style="margin-top:10px"><button id="btnRoomLeave" class="btn primary" type="button">지도로</button></div>
    </div>
  </section>

    <section id="result" class="screen hidden">
    <div class="result">
      <div class="eyebrow" id="resultEyebrow"></div>
      <h1 id="resultTitle"></h1>
      <div class="big"><span id="resultFloor">B1</span></div>
    </div>
    <div class="result-grid" id="resultGrid"></div>
    <div id="resultUnlocks"></div>
    <div id="resultRank" class="eyebrow" style="margin:6px 0 12px"></div>
    <button id="btnInfinite" class="btn primary wide hidden" type="button" style="margin-bottom:8px">무한 역탑으로 계속 내려간다 (B101~)</button>
    <div class="row"><button id="btnAgain" class="btn primary" type="button">다시 내려가기</button><button id="btnHome" class="btn dark" type="button">처음으로</button></div>
    <div class="sharewrap">
      <div class="eyebrow" style="margin-bottom:6px">자랑 카드</div>
      <canvas id="shareCanvas" width="600" height="340"></canvas>
      <div class="row" style="margin-top:8px"><button id="btnShareSave" class="btn dark" type="button">이미지 저장</button><button id="btnShare" class="btn dark" type="button">공유</button><button id="btnReplay" class="btn dark" type="button">마지막 전투 되감기</button></div>
    </div>
  </section>

  <canvas id="fx"></canvas>
  <div id="combo" class="combo"></div>
  <div id="flash" class="flash"></div>
  <div id="bossIntro" class="bossintro"></div>
</div>

<div id="modal" class="modal hidden"><div class="parch" id="modalBox"></div></div>
<div id="toast"></div>
<div id="crt"></div>
<div id="wipe"></div>

<script src="app.7b7ebc78.js"></script>
</body>
</html>
