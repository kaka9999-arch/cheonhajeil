<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#1c1438">
<link rel="icon" href="data:,">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>달빛 경공</title>
<meta name="description" content="달밤 기와지붕 위를 경공으로 달리는 3D 무한 러너. 한 번 누르면 뛰고, 공중에서 한 번 더 뛴다. 굴뚝은 넘고, 박쥐는 그냥 지나가고, 은전을 모으면 질풍이 터진다.">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+KR:wght@400;500;700&display=swap">
<link rel="stylesheet" href="style.dd2dbd95.css">
</head>
<body>

<canvas id="stage"></canvas>

<div id="app">

    <section id="title" class="screen">
    <div class="hero" style="text-align:center;padding:10px 0 8px">
      <div class="sub">- 무한 러너 -</div>
      <h1>달빛<em>경공</em></h1>
      <div class="eyebrow">밤 지붕 위를 달리는 한 자락 그림자</div>
      <div class="eyebrow" style="margin-top:4px"><a href="../">◀ 게임 상자</a></div>
    </div>
    <div class="parch">
      <div class="eyebrow">그림자 <b id="titleName">무명</b> <button id="btnName" class="btn dark sm" type="button" style="margin-left:6px">이름</button></div>
      <p style="margin-top:8px"><b>누르면 뛰고, 공중에서 한 번 더 누르면 두 단 점프</b>예요. 굴뚝은 한 번, 담장은 두 번 뛰어 넘어요. <b>박쥐는 뛰지 말고</b> 그냥 지나가요. 은전 12개면 <b>질풍</b>이 터져요.</p>
      <div class="row" style="margin-top:6px"><button id="btnStart" class="btn primary wide" type="button">달리기</button></div>
    </div>
    <div class="meta-grid" id="metaGrid"></div>
    <div class="row" style="margin-top:6px"><button id="btnRank" class="btn dark" type="button">경공 명부</button><button id="btnSnd" class="btn dark" type="button">소리 켬</button></div>
    <div id="rankPane" hidden style="margin-top:8px"><div id="rankList"></div></div>
  </section>

    <section id="play" class="screen hidden">
    <div class="hud">
      <div class="dist"><b id="hDist">0</b><small>m</small></div>
      <div class="mid"><div class="energy"><i id="energyFill"></i><span id="energyTxt">내력</span></div><div class="biome" id="hBiome">기와골목</div></div>
      <div class="coins">은전 <b id="hCoins">0</b></div>
    </div>
    <div class="banner" id="banner"></div>
    <p class="hint">화면 아무 데나 누르면 뛰어요 · 공중에서 한 번 더</p>
  </section>

    <section id="result" class="screen hidden">
    <div class="result">
      <div class="eyebrow" id="resultEyebrow"></div>
      <h1 id="resultTitle"></h1>
      <div class="big"><span id="resultDist">0</span><small>m</small></div>
    </div>
    <div class="result-grid" id="resultGrid"></div>
    <div id="resultRank" class="eyebrow" style="margin:6px 0 10px"></div>
    <div class="row"><button id="btnAgain" class="btn primary" type="button">다시 달리기</button><button id="btnHome" class="btn dark" type="button">처음으로</button></div>
  </section>

</div>

<div id="modal" class="modal" hidden><div class="parch" id="modalBox"></div></div>
<div id="toast"></div>
<div id="flash" class="flash"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/zzfx@1.3.2/ZzFXMicro.min.js"></script>
<script src="app.a153f027.js"></script>
</body>
</html>
