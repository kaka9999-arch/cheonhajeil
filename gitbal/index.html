<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#1d3144">
<link rel="icon" href="data:,">
<title>여덟 깃발</title>
<meta name="description" content="여덟 세력이 하나의 지도를 두고 다투는 실시간 세력전. 깃발 하나를 골라 에너지로 땅을 넓히고, 세 갈래 상성 싸움으로 점령한다. 지도는 모든 플레이어가 함께 쓴다.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://cdn.jsdelivr.net">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+KR:wght@400;500;700&display=swap">
<link rel="stylesheet" href="style.80ca669a.css">
</head>
<body>
<div id="app">
  <section class="screen" id="scrLoad"><div class="loadbox"><div class="crest"><svg width="84" height="84" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 1.8 21 4.8V12c0 5.2-3.9 8.6-9 10.2C6.9 20.6 3 17.2 3 12V4.8z" fill="#3a2f1c" stroke="#d8b25a" stroke-width="1.2"/><path d="M8.2 17V7.2M8.2 7.6c2.6-1.6 4.6 1.4 7.6-.2v5c-3 1.6-5-1.4-7.6.2" fill="#d8b25a" stroke="#d8b25a" stroke-width="1.3" stroke-linejoin="round" stroke-linecap="round"/></svg></div><h1>여덟 깃발</h1><p id="loadMsg">전황을 불러오는 중…</p></div></section>

  <section class="screen hidden" id="scrPick">
    <header class="pickhead"><h1>여덟 깃발</h1><a class="back" href="../">◀ 게임 상자</a></header>
    <p class="lead">깃발 하나를 고르면 이번 시즌 동안 그 세력의 장수가 된다. 같은 깃발을 든 사람은 모두 한편이고, 지도는 모두가 함께 쓴다.</p>
    <div id="modeNote" class="note hidden"></div>
    <div id="facList" class="faclist"></div>
    <div id="facDetail" class="facdetail"></div>
    <div class="nickrow"><label for="nickIn">장수 이름</label><input id="nickIn" maxlength="8" placeholder="한글 2~8자" autocomplete="off"></div>
    <div class="err" id="pickErr"></div>
    <button class="btn primary big" id="btnJoin" type="button">이 깃발 아래 서기</button>
  </section>

  <section class="screen hidden" id="scrMain">
    <header id="top">
      <button class="chip myfac" id="topFac" type="button" aria-label="내 세력"></button>
      <div class="stat energy"><span>기력 <small id="topEnergyNext"></small></span><b id="topEnergy">0</b><div class="ebar"><i id="topEnergyBar"></i></div></div>
      <div class="stat"><span>금화</span><b id="topGold">0</b></div>
      <div class="stat"><span>레벨</span><b id="topLv">1</b></div>
      <div class="stat"><span>시즌</span><b id="topSeason">-</b></div>
      <button class="chip" id="btnHelp" type="button" aria-label="도움말">?</button>
    </header>
    <div id="goldenBar" class="golden hidden"></div>

    <div class="view" id="vMap">
      <canvas id="map"></canvas>
      <div class="mapbtns"><button class="mbtn find" id="zFind" type="button" aria-label="칠 만한 땅 찾기"><svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 4l10 10M20 4 10 14M6.5 13.5l-3 3 4 4 3-3M17.5 13.5l3 3-4 4-3-3" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></button><button class="mbtn" id="zIn" type="button" aria-label="확대">＋</button><button class="mbtn" id="zOut" type="button" aria-label="축소">－</button><button class="mbtn" id="zHome" type="button" aria-label="우리 수도로">★</button><button class="mbtn" id="zAll" type="button" aria-label="전체 보기">▣</button></div>
      <div id="mapHint" class="maphint"></div>
      <button id="questChip" class="qchip hidden" type="button"></button>
      <div id="firstHint" class="firsthint hidden">칠 만한 땅을 찾아 준다 ▶</div>
      <div id="legend" class="legend"></div>
    </div>
    <div class="view hidden" id="vArmy"></div>
    <div class="view hidden" id="vWar"></div>
    <div class="view hidden" id="vRank"></div>
    <div class="view hidden" id="vChat"><div class="chathead" id="chatHead"></div><div class="chatlist" id="chatList"></div><div class="chatform"><input id="chatIn" maxlength="80" placeholder="할 말 (80자)" autocomplete="off" enterkeyhint="send"><button class="btn primary" id="btnSay" type="button">보내기 <small>기력 1</small></button></div></div>

    <nav id="tabbar">
      <button type="button" data-tab="vMap" class="on"><svg class="ti" width="22" height="22" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 6.5 9 4l6 2.5L21 4v13.5L15 20l-6-2.5L3 20z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><path d="M9 4v13.5M15 6.5V20" stroke="currentColor" stroke-width="1.5"/></svg><span>지도</span></button>
      <button type="button" data-tab="vArmy"><svg class="ti" width="22" height="22" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 13a7 7 0 0 1 14 0v2.5H5z" fill="currentColor"/><path d="M12 4V2.2M4 15.5h16M10.6 15.5V20h2.8v-4.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" fill="none"/></svg><span>부대</span></button>
      <button type="button" data-tab="vWar"><svg class="ti" width="22" height="22" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 21V3.5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><path d="M6 4.5c4-2 6 2 12 0v8c-6 2-8-2-12 0z" fill="currentColor"/></svg><span>전황</span></button>
      <button type="button" data-tab="vRank"><svg class="ti" width="22" height="22" viewBox="0 0 24 24" aria-hidden="true"><path d="M7.5 4h9v5a4.5 4.5 0 0 1-9 0z" fill="currentColor"/><path d="M7.5 5.5H4.6c0 3 1.2 4.4 3.2 4.6M16.5 5.5h2.9c0 3-1.2 4.4-3.2 4.6M12 13.5V17M8.5 20h7M9.5 17h5" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" fill="none"/></svg><span>공적</span></button>
      <button type="button" data-tab="vChat" id="tabChat"><svg class="ti" width="22" height="22" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5.5h16v10H11l-4.5 3.8V15.5H4z" fill="currentColor" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/></svg><span>대화</span></button>
    </nav>
  </section>
</div>

<div class="sheet hidden" id="sheet"><div id="sheetBox"></div></div>
<div class="pop hidden" id="pop"><div id="popBox"></div></div>
<div id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/zzfx@1.3.2/ZzFXMicro.min.js"></script>
<script src="app.5d1c259b.js"></script>
</body>
</html>
