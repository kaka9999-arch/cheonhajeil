<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#1d3144">
<link rel="icon" href="data:,">
<title>여덟 깃발</title>
<meta name="description" content="여덟 세력이 하나의 지도를 두고 다투는 실시간 세력전. 깃발 하나를 골라 에너지로 땅을 넓히고, 세 갈래 상성 싸움으로 점령한다. 지도는 모든 플레이어가 함께 쓴다.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://cdn.jsdelivr.net">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+KR:wght@400;500;700&display=swap">
<link rel="stylesheet" href="style.274de770.css">
</head>
<body>
<div id="app">
  <section class="screen" id="scrLoad"><div class="loadbox"><div class="crest">⚑</div><h1>여덟 깃발</h1><p id="loadMsg">전황을 불러오는 중…</p></div></section>

  <section class="screen hidden" id="scrPick">
    <header class="pickhead"><h1>여덟 깃발</h1><a class="back" href="../">◀ 게임 상자</a></header>
    <p class="lead">깃발 하나를 고르면 이번 시즌 동안 그 세력의 장수가 된다. 같은 깃발을 든 사람은 모두 한편이고, 지도는 모두가 함께 쓴다.</p>
    <div id="modeNote" class="note hidden"></div>
    <div id="facList" class="faclist"></div>
    <div id="facDetail" class="facdetail"></div>
    <div class="nickrow"><label for="nickIn">장수 이름</label><input id="nickIn" maxlength="8" placeholder="한글 2~8자" autocomplete="off"></div>
    <div class="err" id="pickErr"></div>
    <button class="btn primary big" id="btnJoin" type="button">이 깃발 아래 서기</button>
  </section>

  <section class="screen hidden" id="scrMain">
    <header id="top">
      <button class="chip myfac" id="topFac" type="button" aria-label="내 세력"></button>
      <div class="stat"><span>기력</span><b id="topEnergy">0</b><small id="topEnergyNext"></small></div>
      <div class="stat"><span>금화</span><b id="topGold">0</b></div>
      <div class="stat"><span>레벨</span><b id="topLv">1</b></div>
      <div class="stat"><span>시즌</span><b id="topSeason">-</b></div>
      <button class="chip" id="btnHelp" type="button" aria-label="도움말">?</button>
    </header>

    <div class="view" id="vMap">
      <canvas id="map"></canvas>
      <div class="mapbtns"><button class="mbtn" id="zIn" type="button" aria-label="확대">＋</button><button class="mbtn" id="zOut" type="button" aria-label="축소">－</button><button class="mbtn" id="zHome" type="button" aria-label="우리 수도로">★</button><button class="mbtn" id="zAll" type="button" aria-label="전체 보기">▣</button></div>
      <div id="mapHint" class="maphint"></div>
      <div id="legend" class="legend"></div>
    </div>
    <div class="view hidden" id="vArmy"></div>
    <div class="view hidden" id="vWar"></div>
    <div class="view hidden" id="vRank"></div>
    <div class="view hidden" id="vChat"><div class="chathead" id="chatHead"></div><div class="chatlist" id="chatList"></div><div class="chatform"><input id="chatIn" maxlength="80" placeholder="할 말 (80자)" autocomplete="off" enterkeyhint="send"><button class="btn primary" id="btnSay" type="button">보내기 <small>기력 1</small></button></div></div>

    <nav id="tabbar">
      <button type="button" data-tab="vMap" class="on">지도</button>
      <button type="button" data-tab="vArmy">부대</button>
      <button type="button" data-tab="vWar">전황</button>
      <button type="button" data-tab="vRank">공적</button>
      <button type="button" data-tab="vChat" id="tabChat">대화</button>
    </nav>
  </section>
</div>

<div class="sheet hidden" id="sheet"><div id="sheetBox"></div></div>
<div class="pop hidden" id="pop"><div id="popBox"></div></div>
<div id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/zzfx@1.3.2/ZzFXMicro.min.js"></script>
<script src="app.114428e7.js"></script>
</body>
</html>
