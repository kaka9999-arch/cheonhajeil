<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#140d09">
<link rel="icon" href="data:,">
<title>그림자 극단</title>
<meta name="description" content="그림자 인형 다섯을 세워 남의 극단 그림자와 겨루는 수집 대전. 내가 없는 동안에도 내 그림자가 싸운다.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+KR:wght@500;700&display=swap">
<link rel="stylesheet" href="style.4a8cdfd4.css">
</head>
<body>
<div id="app">
  <header class="head">
    <h1>그림자 극단</h1>
    <div class="chips"><span class="chip" id="cOil" title="등불 기름">기름 <b>0</b></span><span class="chip" id="cTix" title="결투 표">표 <b>0</b></span></div>
    <a class="home" href="../">◀ 게임 상자</a>
  </header>

    <section class="screen" id="scrJoin" hidden>
    <div class="stage tall" id="joinStage"></div>
    <div class="card">
      <h2>등불 뒤 한지 막 위에서</h2>
      <p>인형 다섯을 줄 세워 다른 단장의 <b>그림자</b>와 겨뤄요.<br>내가 없는 동안에도 내 극단이 그림자로 남아 싸워요.</p>
      <label class="lab" for="nickIn">단장 이름 (한글 2~8자)</label>
      <input id="nickIn" maxlength="8" placeholder="예: 달빛단장" autocomplete="off">
      <div class="err" id="nickErr"></div>
      <button class="btn primary" id="btnJoin" type="button">극단 꾸리기</button>
    </div>
  </section>

    <section class="screen" id="scrMain" hidden>
    <div class="note" id="modeNote" hidden></div>

    <div class="view" id="vStage">
      <div class="stage" id="myStage"></div>
      <div class="synline" id="synStage"></div>
      <div class="card row3">
        <div><span>점수</span><b id="sRating">0</b></div>
        <div><span>전적</span><b id="sRecord">0승 0패</b></div>
        <div><span>시즌</span><b id="sSeason">-</b></div>
      </div>
      <button class="btn primary big" id="btnDuel" type="button">결투</button>
      <div class="mute center" id="tixNext"></div>
      <div class="card" id="awayCard" hidden></div>
      <button class="btn ghost" id="btnHelp" type="button">규칙 보기</button>
    </div>

    <div class="view hidden" id="vTroupe" hidden>
      <div class="card">
        <h3>내 줄 <small class="mute">왼쪽이 맨 앞 · 이 줄이 그림자로 남아요</small></h3>
        <div class="line" id="lineSlots"></div>
        <div class="synline" id="synTroupe"></div>
      </div>
      <div class="card">
        <h3>인형 도감 <small class="mute" id="colCount"></small></h3>
        <div class="fams" id="famChips"></div>
        <div class="grid" id="colGrid"></div>
      </div>
    </div>

    <div class="view hidden" id="vGacha" hidden>
      <div class="stage lantern" id="gachaArt"></div>
      <div class="card center">
        <p class="mute" id="gachaInfo"></p>
        <div class="btnrow">
          <button class="btn" id="btnDraw1" type="button">한 번 <small>기름 100</small></button>
          <button class="btn primary" id="btnDraw10" type="button">열 번 <small>기름 900</small></button>
        </div>
        <p class="mute small" id="rateLine"></p>
      </div>
    </div>

    <div class="view hidden" id="vRank" hidden>
      <div class="card"><h3>점수표 <small class="mute" id="rankMine"></small></h3><div class="rank" id="rankList"></div></div>
      <div class="card"><h3>결투 기록 <small class="mute">누르면 다시 보기</small></h3><div class="logs" id="logList"></div></div>
      <div class="card" id="hallCard" hidden></div>
    </div>

    <nav id="tabbar">
      <button type="button" data-tab="vStage" class="on">무대</button>
      <button type="button" data-tab="vTroupe">극단</button>
      <button type="button" data-tab="vGacha">뽑기</button>
      <button type="button" data-tab="vRank">순위</button>
    </nav>
  </section>
</div>

<div class="sheet hidden" id="sheet" hidden><div class="sheetBox" id="sheetBox"></div></div>
<div class="pop hidden" id="pop" hidden><div class="popBox" id="popBox"></div></div>
<div id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/zzfx@1.3.2/ZzFXMicro.min.js"></script>
<script src="app.b31f2a39.js"></script>
</body>
</html>
