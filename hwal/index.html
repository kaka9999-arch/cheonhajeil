<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#0a0e1c">
<link rel="icon" href="data:,">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>월야 국궁</title>
<meta name="description" content="달빛 아래 사대에서 표적을 겨눈다. 누르고 있으면 조준이 움직이고 오래 당길수록 힘이 실리지만 손이 떨린다. 바람을 읽고 풀어라.">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Song+Myung&display=swap">
<link rel="stylesheet" href="style.eb5745f2.css">
</head>
<body>
<div id="app">

    <section id="title" class="screen">
    <div class="hero">
      <div class="sub">- 조준 액션 -</div>
      <h1>월야<em>국궁</em></h1>
      <div class="eyebrow">달빛 아래 한 순(巡), 바람을 읽고 놓는다</div>
      <div class="eyebrow" style="margin-top:4px"><a href="../" class="linklike">◀ 게임 상자</a></div>
    </div>
    <div class="panel">
      <div class="eyebrow">궁수 <b id="titleName" style="color:var(--paper)">무명</b> <button id="btnName" class="btn dark sm" type="button" style="margin-left:6px">이름</button></div>
      <p style="margin-top:8px"><b>누르고 있으면 조준이 움직이고</b>, 오래 누를수록 화살이 강해져 바람을 덜 타지만 <b>너무 오래 당기면 손이 떨린다</b>. 놓으면 발사. 완전히 빗나가면 하트가 줄고, 하트 3개를 잃으면 끝난다. 5발마다 표적이 좁아지고 바람이 세지며, 6순마다 <b style="color:var(--gold)">황금 표적</b>(점수 3배)이 나타난다.</p>
      <div class="row" style="margin-top:6px"><button id="btnStart" class="btn primary wide" type="button">활 잡기</button></div>
    </div>
    <div class="meta-grid" id="metaGrid"></div>
    <div class="row" style="margin-top:6px"><button id="btnRank" class="btn dark" type="button">사대 명부</button></div>
    <div id="rankPane" hidden style="margin-top:8px"><div id="rankList"></div></div>
  </section>

    <section id="play" class="screen hidden">
    <div class="hud">
      <div class="score"><b id="hScore">0</b><small>점</small></div>
      <div class="mid"><div class="hearts" id="hHearts"></div><div class="roundtag" id="hRound">1순</div></div>
      <div class="wind">바람 <b id="hWind">0</b></div>
    </div>
    <div class="stagewrap" id="stagewrap"><canvas id="stage" width="360" height="380"></canvas><div class="banner" id="banner"></div></div>
    <p class="hint">눌러서 조준 · 오래 당길수록 강함 · 놓으면 발사</p>
  </section>

    <section id="result" class="screen hidden">
    <div class="result">
      <div class="eyebrow" id="resultEyebrow"></div>
      <h1 id="resultTitle"></h1>
      <div class="big"><span id="resultScore">0</span><small>점</small></div>
    </div>
    <div class="result-grid" id="resultGrid"></div>
    <div id="resultRank" class="eyebrow" style="margin:6px 0 10px"></div>
    <div class="row"><button id="btnAgain" class="btn primary" type="button">다시 서다</button><button id="btnHome" class="btn dark" type="button">처음으로</button></div>
  </section>

</div>

<div id="modal" class="modal" hidden><div class="panel" id="modalBox"></div></div>
<div id="toast"></div>
<div id="crt"></div>

<script src="app.a879ee0f.js"></script>
</body>
</html>
