<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#a9d3ff">
<link rel="icon" href="data:,">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>양털 빠칭코</title>
<meta name="description" content="초원 축제용 빠칭코. 양 범퍼와 보석 못을 지나 양털 주머니에 넣으면 룬 슬롯이 돌고 피버가 터진다. 번 골드로 다른 게임의 아이템을 산다.">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+KR:wght@400;500;700;900&display=swap">
<link rel="stylesheet" href="style.d30db92d.css">
</head>
<body>
<div id="app">
  <header class="head">
    <h1>양털 빠칭코<small>WOOL PACHINKO · 초원 축제 한정판</small></h1>
    <div><div class="hud"><div class="balls"><span>구슬</span><b id="hBalls">30</b></div><div class="gold"><span>이번 판</span><b id="hGold">0</b></div><div><span>최고</span><b id="hBest">0</b></div><div class="gold"><span>지갑</span><b id="hWallet">0</b></div></div><div class="headbtns"><a href="../" style="font-family:var(--display);font-size:13px;color:#5e3714;background:var(--gold3);border:2px solid var(--wood2);border-radius:10px;padding:2px 8px;box-shadow:0 2px 0 var(--wood2);text-decoration:none">◀ 상자</a><button id="btnShop" type="button">상점</button><button id="btnRankOpen" type="button">명예의 목장</button><button id="btnNickOpen" type="button">이름</button></div></div>
  </header>
  <div class="boardwrap" id="boardwrap"><canvas id="board"></canvas><div class="toast" id="toast"></div></div>
  <div class="controls">
    <div class="hint"><b>판을 누르면</b> 그 자리에 구슬이 떨어지고, <b>발사를 꾹 누르면</b> 요정이 좌우로 오가며 연사합니다. 가운데 <b>양털 주머니</b>에 넣으면 액정의 룬이 돕니다. 둘이 맞으면 <b>리치</b>, 셋이 맞으면 <b>피버</b>!</div>
    <div><button class="fire" id="fire" type="button">발사</button><button class="refill" id="refill" type="button">구슬 30개</button></div>
  </div>
</div>
<div class="panel hidden" id="shopPanel"><div class="pbox"><h2>초원 상점 <small>지갑 <b id="shopGold">0</b>G</small></h2><p class="pdesc">빠칭코에서 번 골드로 다른 게임에 쓸 아이템을 산다. 산 아이템은 그 게임의 <b>선물 상자</b>에서 쓴다.</p><div id="shopList"></div><button class="pclose" id="shopClose" type="button">닫기</button></div></div>
<div class="panel hidden" id="rankPanel"><div class="pbox"><h2>명예의 목장 <small>한 판 최고 골드</small></h2><div id="rankList"></div><button class="pclose" id="rankClose" type="button">닫기</button></div></div>
<div class="panel hidden" id="namePanel"><div class="pbox"><h2>목장에 남길 이름</h2><p class="pdesc">순위표에 올라갈 이름. 한글 2~8자. 다른 게임과 같이 쓴다.</p><input id="nameIn" maxlength="8" placeholder="예: 양치기소녀"><div class="perr" id="nameErr"></div><button class="pclose primary" id="nameGo" type="button">등록</button><button class="pclose" id="nameSkip" type="button">나중에</button></div></div>
<div id="toastG" class="toastg"></div>
<script src="app.a84c74b6.js"></script>
</body>
</html>
