<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#5cc8ff">
<link rel="icon" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>이세계 길드 이야기</title>
<meta name="description" content="F급 모험가 길드를 물려받은 접수원이 20년 안에 S급 길드를 만드는 픽셀 경영 시뮬레이션. 의뢰·파티·건물 콤보·전이자·마왕군.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+KR:wght@400;500;700&display=swap">
<link rel="stylesheet" href="style.b68d9c17.css">
</head>
<body>
<div id="app">
  <canvas id="scene"></canvas>

    <section id="title" class="screen">
    <div class="hero">
      <div class="sub">- GUILD MANAGEMENT -</div>
      <h1>이세계<br><em>길드 이야기</em></h1>
      <canvas class="logo" id="logo" width="96" height="48" aria-hidden="true"></canvas>
      <div class="eyebrow">F급 길드의 접수원이 되어 20년 안에 S급으로</div>
      <div><a class="eyebrow" href="../">◀ 게임 상자</a></div>
    </div>
    <div class="parch">
      <div class="eyebrow" style="display:flex;align-items:center;gap:8px">접수원 <b id="titleName" style="font-weight:400;color:var(--ink)">무명</b> <button id="btnName" class="btn sm" type="button">이름</button></div>
      <div id="titleInfo" class="mute" style="margin:6px 0"></div>
      <div class="row" style="margin-top:8px">
        <button id="btnContinue" class="btn primary hidden" type="button">이어서 운영</button>
        <button id="btnNew" class="btn primary" type="button">새 길드 열기</button>
      </div>
      <div id="hallBox" class="mute" style="margin-top:8px"></div>
    </div>
    <div id="dailyBox"></div>
    <div class="meta-grid" id="metaGrid"></div>
    <div class="row">
      <button id="btnRank" class="btn dark" type="button">길드 순위표</button>
      <button id="btnHelp" class="btn dark" type="button">규칙</button>
    </div>
    <div id="rankPane" class="hidden" style="margin-top:10px">
      <div class="tabs2"><button data-tab="all" class="active" type="button">전체</button><button data-tab="daily" type="button">오늘의 도전</button></div>
      <div id="rankList"></div>
    </div>
  </section>

    <section id="main" class="screen hidden">
        <div class="hud">
      <div class="me">
        <div class="avatar"><img id="avatarImg" class="px" alt=""><span class="rk" id="tRank">F</span></div>
        <div><div class="nm" id="tName">새싹 길드</div><div class="xp" title="다음 랭크까지 명성"><i id="tFameBar" style="width:0%"></i><span id="tFame">명성 0</span></div></div>
      </div>
      <div class="caps">
        <div class="cap" id="capGold"><span class="coin">G</span><b id="tGold" style="font-weight:400">500</b></div>
        <div class="cap hidden" id="capMat" title="소재"><span class="gemI"></span><b id="tMat" style="font-weight:400">0</b></div>
        <div class="cap hidden" id="capRp" title="연구 포인트"><span class="bookI"></span><b id="tRp" style="font-weight:400">0</b></div>
      </div>
      <div class="hud2">
        <div class="datepill"><b id="tYear">1</b>년차 <span id="tMonth">1</span>월 <span id="tDay">1</span>일</div>
        <div class="demon hidden" id="demonBox">마왕군 <div class="bar"><i id="tDemon" style="width:0%"></i></div><span id="tDemonN">0</span></div>
        <div class="speed" id="speed"><button id="spPause" type="button" aria-label="일시정지">❚❚</button><button id="spCycle" type="button" class="on">▶ 1배</button></div>
      </div>
      <div class="menupause hidden" id="menuPause">메뉴를 보는 동안 시간이 멈춘다</div>
    </div>
    <div class="guildwrap"><canvas id="guild"></canvas><div id="floats"></div></div>
    <div class="fieldwrap"><canvas id="field"></canvas><div id="stamp" class="stampfx"></div></div>
    <div class="pane" id="pane"></div>
        <nav class="tabs" id="tabs" aria-label="메뉴">
      <button data-tab="guild" class="active" type="button"><span class="ti"><img class="px" data-icon="BLD:desk" alt=""></span>길드</button>
      <button data-tab="advs" type="button"><span class="ti"><img class="px" data-icon="HERO:warrior" alt=""></span>모험가</button>
      <button data-tab="quests" class="center" type="button"><span class="big"><img class="px" data-icon="ICON:ex" alt=""><span class="badge hidden" id="bQuests"></span></span>의뢰</button>
      <button data-tab="dex" type="button"><span class="ti"><img class="px" data-icon="ICON:q" alt=""></span>도감</button>
      <button data-tab="book" type="button"><span class="ti"><span class="menuI"><i></i><i></i><i></i></span></span>메뉴</button>
    </nav>
  </section>

    <section id="result" class="screen hidden">
    <div class="result">
      <div class="eyebrow" id="resultEyebrow"></div>
      <h1 id="resultTitle"></h1>
      <div class="big"><span id="resultScore">0</span><small>점</small></div>
    </div>
    <div id="resultText" class="parch" style="margin-bottom:8px"></div>
    <div class="meta-grid" id="resultGrid"></div>
    <div id="resultRank" class="eyebrow" style="margin:6px 0 10px"></div>
    <div id="hallPick"></div>
    <div class="row"><button id="btnAgain" class="btn primary" type="button">새 길드 열기</button><button id="btnHome" class="btn" type="button">처음으로</button></div>
    <div class="sharewrap"><div class="eyebrow" style="margin:12px 0 6px">자랑 카드</div><canvas id="shareCanvas" data-menu width="600" height="340" style="width:100%;display:block"></canvas><div class="row" style="margin-top:8px"><button id="btnShareSave" class="btn dark" type="button">이미지 저장</button><button id="btnShare" class="btn dark" type="button">공유</button></div></div>
  </section>

  <div id="discover" class="discover"><div class="box"><div class="k" id="discK">NEW!</div><h2 id="discName"></h2><p id="discDesc"></p><p class="mute" style="margin-top:8px">누르면 닫힘</p></div></div>
</div>

<div id="modal" class="modal hidden"><div class="parch" id="modalBox"></div></div>
<div id="toast"></div>
<div id="crt"></div>
<div id="wipe"></div>

<script src="app.6a1810dd.js"></script>
</body>
</html>
