<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#2b1d4e">
<link rel="icon" href="data:,">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>탑의 주인</title>
<meta name="description" content="탑의 주인이 되어 올라오는 모험가를 거의 죽인다. 층마다 몬스터를 두면 결과가 미리 보인다. 체력이 바닥까지 떨어졌다가 도망친 손님이 가장 큰 마력을 남긴다.">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum&display=swap">
<link rel="stylesheet" href="style.fbf2352e.css">
</head>
<body>
<div id="app">

    <section id="title" class="screen">
    <div class="hero">
      <div class="sub">- DUNGEON MASTER -</div>
      <h1>탑의<br><em>주인</em></h1>
      <canvas id="logo" width="120" height="72" aria-hidden="true"></canvas>
      <div class="tag">모험가를 죽이지 말고, <b>거의</b> 죽여라</div>
      <div><a class="back" href="../">◀ 게임 상자</a></div>
    </div>
    <div class="panel">
      <div class="who">주인 <b id="titleName">무명</b> <button id="btnName" class="btn sm" type="button">이름</button></div>
      <div id="titleInfo" class="mute"></div>
      <div class="row">
        <button id="btnContinue" class="btn primary hidden" type="button">이어서 하기</button>
        <button id="btnNew" class="btn primary" type="button">새 탑 세우기</button>
      </div>
    </div>
    <div class="howto">
      <div><b>1 · 층에 몬스터를 둔다</b><span>층을 누르면 둘 몬스터를 고른다. 두는 순간 손님이 어떻게 될지 <em>예상</em>이 보인다.</span></div>
      <div><b>2 · 문을 연다</b><span>손님이 한 층씩 오르며 싸운다. 체력이 성격마다 정해진 선 아래로 떨어지면 도망친다.</span></div>
      <div><b>3 · 거의 죽인다</b><span>최저 체력 20% 이하로 도망 = <em>황금 ×3</em>. 높이 올라왔다 도망칠수록 더 많이. 죽이면 ×0.5, 꼭대기 심장까지 오면 ♥ −1.</span></div>
    </div>
    <div class="meta" id="metaGrid"></div>
    <button id="btnRank" class="btn wide" type="button">주인들의 순위표</button>
    <div id="rankPane" class="hidden"><div id="rankList"></div></div>
  </section>

    <section id="play" class="screen hidden">
    <div class="hud">
      <div class="hearts" id="hearts" aria-label="남은 심장"></div>
      <div class="cap" title="마력"><span class="manaI"></span><b id="mana">0</b></div>
      <button class="roundbtn" id="btnMenu" type="button" aria-label="메뉴"><span class="menuI"><i></i><i></i><i></i></span></button>
    </div>
    <div class="season">
      <span class="stxt" id="seasonTxt">시즌 1</span>
      <div class="quota"><div class="bar"><i id="quotaBar"></i></div><span id="quotaTxt">목표 0/0</span></div>
    </div>
    <div class="guests" id="guests"></div>
    <div class="towerwrap" id="towerwrap"><canvas id="tower"></canvas><div id="floats"></div></div>
    <div class="forecast" id="forecast"></div>
    <div class="actions">
      <button class="btn primary go" id="btnGo" type="button">문 열기</button>
      <button class="btn fast" id="btnFast" type="button" aria-label="빠르게">▶▶</button>
    </div>
  </section>

    <section id="over" class="screen hidden">
    <div class="result">
      <div class="eyebrow" id="overEyebrow"></div>
      <h1 id="overTitle">탑이 무너졌다</h1>
      <div class="big"><span id="overScore">0</span><small>점</small></div>
    </div>
    <div class="panel" id="overText"></div>
    <div class="meta" id="overGrid"></div>
    <div id="overRank" class="mute center"></div>
    <div class="row"><button id="btnAgain" class="btn primary" type="button">다시 세우기</button><button id="btnHome" class="btn" type="button">처음으로</button></div>
  </section>
</div>

<div id="sheet" class="sheet hidden" role="dialog" aria-modal="true"><div class="box" id="sheetBox"></div></div>
<div id="pop" class="pop hidden"><div class="box" id="popBox"></div></div>
<div id="toast" role="status" aria-live="polite"></div>

<script src="app.28de6020.js"></script>
</body>
</html>
