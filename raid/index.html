<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#181425">
<link rel="icon" href="data:,">
<title>요괴 토벌대 (실시간 시험)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+KR:wght@500;700&display=swap">
<link rel="stylesheet" href="style.298ec71c.css">
</head>
<body>
<section class="screen" id="scrPick">
  <header class="head"><h1>요괴 토벌대 <small>실시간 시험</small></h1><a href="../">◀ 게임 상자</a></header>
  <p class="lead">같은 시간에 들어온 사람끼리 한 방에서 요괴를 잡아요. 창 두 개를 띄우면 혼자서도 확인할 수 있어요.</p>
  <div class="roles" id="roles"></div>
  <label class="lab" for="nickIn">이름</label>
  <input id="nickIn" maxlength="8" autocomplete="off">
  <button class="btn primary" id="btnGo" type="button">토벌대 합류</button>
  <p class="mute" id="netNote"></p>
</section>

<section class="screen hidden" id="scrPlay" hidden>
  <canvas id="cv"></canvas>
  <div class="top">
    <div class="bossbar"><b>먹구름 두억시니</b><span id="bossHp"></span><div class="bar"><i id="bossFill"></i></div></div>
    <div class="party" id="party"></div>
  </div>
  <div class="pad" id="pad"><i id="knob"></i></div>
  <div class="acts">
    <button type="button" id="btnSkill" class="act sk">기술</button>
    <button type="button" id="btnAtk" class="act at">공격</button>
  </div>
  <div class="banner hidden" id="banner" hidden></div>
</section>
<div id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="app.e2e22e47.js"></script>
</body>
</html>
