<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#5cc8ff">
<link rel="icon" href="tower/icon-192.png">
<title>게임 상자</title>
<meta name="description" content="설치 없이 브라우저에서 바로 하는 게임 25종. 육성 RPG·농장·무역·퍼즐·액션. 공개 랭킹과 공용 지갑.">
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+KR:wght@400;500;700&display=swap">
<link rel="stylesheet" href="style.32bd27ba.css">
</head>
<body data-allow-menu>
<div id="app">
  <canvas id="scene"></canvas>
    <header class="top">
    <div class="bar">
      <div class="me">
        <div class="avatar" id="avatar" aria-hidden="true">?</div>
        <div class="who"><b id="nick">무명</b></div>
      </div>
      <div class="cap" title="공용 지갑 골드 — 양털 빠칭코에서 번다"><span class="coin">G</span><b id="wallet">0</b></div>
      <button class="roundbtn" id="btnSync" type="button" aria-label="저장 동기화"><span class="cloudI"></span></button>
    </div>
    <div class="brand"><div class="sub">- GAME BOX -</div><h1>게임 <em>상자</em></h1></div>
  </header>
  <main>
    <div class="sect"><span id="allCount" class="mute"></span></div>
    <div id="allList" class="cards"></div>
  </main>
  <footer class="mute">kaka9999-arch.github.io/cheonhajeil</footer>
</div>
<div class="modal" id="syncModal" hidden><div class="parch">
  <h2>저장 동기화</h2>
  <div class="mute">게임을 하는 동안 저장이 서버에 올라간다. 다른 기기에서 아래 코드를 넣으면 같은 사람으로 이어진다.</div>
  <div class="codebox"><span>내 코드</span><b id="myCode">불러오는 중…</b><button class="btn" id="codeCopy" type="button">복사</button></div>
  <div class="row"><button class="btn" id="codeRotate" type="button">코드 재발급</button><button class="btn" id="autoToggle" type="button">자동 올리기 끄기</button></div>
  <h3>다른 기기의 코드 넣기</h3>
  <div class="mute">이 기기의 기록은 그 코드의 기록으로 <b style="color:var(--red)">전부 바뀐다</b>. 먼저 이 기기 것을 올려 두고 싶으면 아래 "전부 올리기"를 누른다.</div>
  <div class="row"><input id="codeIn" maxlength="9" placeholder="XXXX-XXXX" autocapitalize="characters" autocomplete="off"><button class="btn primary" id="codeGo" type="button">이어하기</button></div>
  <div class="err" id="syncErr"></div>
  <h3>게임별 저장</h3>
  <div id="syncList" class="synclist"><div class="mute">불러오는 중…</div></div>
  <div class="row"><button class="btn" id="pushAll" type="button">전부 올리기</button><button class="btn" id="syncClose" type="button">닫기</button></div>
</div></div>
<div id="crt"></div>
<script src="app.59f40cb5.js"></script>
</body>
</html>
