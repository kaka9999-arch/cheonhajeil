<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#06061a">
<link rel="icon" href="data:,">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>철옹성</title>
<meta name="description" content="궁수·마법사·창병·대포를 배치해 30파도의 마수로부터 관문을 지키는 타워디펜스. 클리어하면 무한모드로 이어진다.">
<link rel="stylesheet" href="style.228ecb91.css">
</head>
<body>
<div id="app">

    <section id="title" class="screen">
    <div class="hero" style="text-align:center;padding:16px 0 10px">
      <div class="sub" style="font-size:11px;color:var(--tx2);letter-spacing:2px">- 타워디펜스 -</div>
      <h1>철옹<em>성</em></h1>
      <div class="eyebrow">30파도의 마수로부터 관문을 지켜라</div>
      <div class="eyebrow" style="margin-top:4px"><a href="../" style="color:var(--ylw)">◀ 게임 상자</a></div>
    </div>
    <div class="parch">
      <div class="eyebrow">수문장 <b id="titleName">무명</b> <button id="btnName" class="btn dark sm" type="button" style="margin-left:6px">이름</button></div>
      <p style="margin-top:8px">빈 칸에 <b>창병·궁수·마법사·대포</b>를 놓아 경로로 오는 마수를 막는다. 새는 마수는 목숨을 깎고, 목숨이 0이 되면 그 자리에서 끝. 방패몹은 범위 피해에 약하고, 비행몹은 창병·대포로 못 때린다. 30파도를 다 막으면 무한모드로 이어서 기록에 도전한다.</p>
      <div class="row" style="margin-top:6px"><button id="btnStart" class="btn primary wide" type="button">수성 시작</button></div>
    </div>
    <div class="meta-grid" id="metaGrid"></div>
    <div class="parch" style="margin-top:6px">
      <div class="eyebrow">영구 강화 <small style="color:var(--tx2)">명성으로 구매, 판을 거듭할수록 쌓인다</small></div>
      <div id="upgList" style="margin-top:8px"></div>
    </div>
    <div class="row" style="margin-top:8px">
      <button id="btnRank" class="btn dark" type="button">수문장 명부</button>
    </div>
    <div id="rankPane" class="hidden" style="margin-top:8px">
      <div id="rankList"></div>
    </div>
  </section>

    <section id="play" class="screen hidden">
    <div class="hud">
      <div class="gold"><span>골드</span><b id="hGold">0</b></div>
      <div class="lives"><span>목숨</span><b id="hLives">0</b></div>
      <div><span>파도</span><b id="hWave">0</b></div>
      <div><span>처치</span><b id="hKills">0</b></div>
    </div>
    <div class="ctrlrow">
      <button id="btnWave" class="btn primary" type="button">파도 시작</button>
      <div class="speedgrp">
        <button data-spd="1" class="active" type="button">1×</button>
        <button data-spd="2" type="button">2×</button>
        <button data-spd="3" type="button">3×</button>
      </div>
      <button id="btnPause" class="btn dark" type="button" style="flex:none;padding:7px 10px">Ⅱ</button>
    </div>
    <div class="boardwrap"><canvas id="board" width="360" height="280"></canvas></div>

    <div id="towerInfo" class="towerinfo hidden"></div>

    <div class="shopgrid" id="shop"></div>
    <p class="hint">빈 칸을 눌러 고른 타워를 놓는다. 이미 놓은 타워를 누르면 업그레이드·판매.</p>
    <div class="row"><button id="btnGiveup" class="btn dark" type="button">여기까지 지키고 물러나기</button></div>
  </section>

    <section id="result" class="screen hidden">
    <div class="result">
      <div class="eyebrow" id="resultEyebrow"></div>
      <h1 id="resultTitle"></h1>
      <div class="big"><span id="resultWave">0</span><small>파도</small></div>
    </div>
    <div class="result-grid" id="resultGrid"></div>
    <div id="resultRank" class="eyebrow" style="margin:6px 0 10px"></div>
    <div class="row"><button id="btnAgain" class="btn primary" type="button">다시 수성</button><button id="btnHome" class="btn dark" type="button">처음으로</button></div>
  </section>

</div>

<div id="modal" class="modal hidden"><div class="parch" id="modalBox"></div></div>
<div id="toast"></div>
<div id="flash" class="flash"></div>
<div id="crt"></div>

<script src="app.04806813.js"></script>
</body>
</html>
